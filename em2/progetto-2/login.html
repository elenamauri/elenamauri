<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesso Protetto – EM Portfolio</title>
  <link rel="stylesheet" href="../css/style2.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
  
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-color);
      padding: var(--padding-XS);
    }
    
    .login-container {
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    
    .login-container h1 {
      font-size: var(--font-size-XL);
      margin-bottom: var(--padding-M);
      color: var(--text-color);
    }
    
    .login-form {
      width: 100%;
    }
    
    .login-form input {
      width: 100%;
      padding: 1rem;
      font-size: var(--font-size-S);
      font-family: 'Bricolage Grotesque', sans-serif;
      border: 2px solid var(--text-color);
      background: var(--creamy-white);
      color: var(--text-color);
      border-radius: 4px;
      margin-bottom: var(--padding-M);
      box-sizing: border-box;
    }
    
    .login-form input:focus {
      outline: none;
      border-color: var(--accent-color);
    }
    
    .login-form button {
      width: 100%;
      padding: 1rem 2rem;
      font-size: var(--font-size-S);
      font-family: 'Bricolage Grotesque', sans-serif;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    
    .login-form button:hover {
      opacity: 0.8;
    }
    
    .login-error {
      color: #d32f2f;
      font-size: var(--font-size-S);
      margin-top: var(--padding-XS);
      display: none;
    }
    
    .login-error.show {
      display: block;
    }
    
    .back-link {
      margin-top: var(--padding-M);
      display: inline-block;
      color: var(--text-color);
      text-decoration: none;
      font-size: var(--font-size-S);
      transition: color 0.3s ease;
    }
    
    .back-link:hover {
      color: var(--accent-color);
    }
    
    .ask-link {
      margin-top: var(--padding-M);
      display: block;
      color: var(--text-color);
      text-decoration: none;
      font-size: var(--font-size-S);
      transition: color 0.3s ease;
    }
    
    .ask-link:hover {
      color: var(--accent-color);
    }
    
    .ask-link .underlined {
      text-decoration: underline;
    }
    
    /* Modale richiesta password */
    .request-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 10001;
      display: none;
      align-items: center;
      justify-content: center;
      padding: var(--padding-XS);
      box-sizing: border-box;
    }
    
    .request-modal.show {
      display: flex;
    }
    
    .request-modal-content {
      background: var(--bg-color);
      max-width: 500px;
      width: 100%;
      padding: var(--padding-L);
      border-radius: 8px;
      position: relative;
    }
    
    .request-modal-close {
      position: absolute;
      top: var(--padding-XS);
      right: var(--padding-XS);
      background: none;
      border: none;
      font-size: 2rem;
      color: var(--text-color);
      cursor: pointer;
      line-height: 1;
      padding: 0;
      width: 2rem;
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.3s ease;
    }
    
    .request-modal-close:hover {
      color: var(--accent-color);
    }
    
    .request-modal h2 {
      font-size: var(--font-size-L);
      margin-bottom: var(--padding-M);
      color: var(--text-color);
    }
    
    .request-form {
      width: 100%;
    }
    
    .request-form-group {
      margin-bottom: var(--padding-M);
    }
    
    .request-form label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: var(--font-size-S);
      color: var(--text-color);
    }
    
    .request-form label .required {
      color: #d32f2f;
    }
    
    .request-form input {
      width: 100%;
      padding: 1rem;
      font-size: var(--font-size-S);
      font-family: 'Bricolage Grotesque', sans-serif;
      border: 2px solid var(--text-color);
      background: var(--creamy-white);
      color: var(--text-color);
      border-radius: 4px;
      box-sizing: border-box;
    }
    
    .request-form input:focus {
      outline: none;
      border-color: var(--accent-color);
    }
    
    .request-form button {
      width: 100%;
      padding: 1rem 2rem;
      font-size: var(--font-size-S);
      font-family: 'Bricolage Grotesque', sans-serif;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    
    .request-form button:hover:not(:disabled) {
      opacity: 0.8;
    }
    
    .request-form button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .request-message {
      margin-top: var(--padding-M);
      padding: 1rem;
      border-radius: 4px;
      font-size: var(--font-size-S);
      display: none;
    }
    
    .request-message.show {
      display: block;
    }
    
    .request-message.success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #4caf50;
    }
    
    .request-message.error {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ef5350;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Accesso Protetto</h1>
    <form class="login-form" id="loginForm">
      <input 
        type="password" 
        id="passwordInput" 
        placeholder="Inserisci la password" 
        autocomplete="off"
        autofocus
        required
      >
      <button type="submit">Accedi</button>
      <div class="login-error" id="loginError">
        Password non corretta. Riprova.
      </div>
    </form>
    <a href="../index2.html" class="back-link">← Torna alla home</a>
    <a href="#" class="ask-link" id="askLink">
      Don't have the password? <span class="underlined">Ask me</span>
    </a>
  </div>
  
  <!-- Modale richiesta password -->
  <div class="request-modal" id="requestModal">
    <div class="request-modal-content">
      <button class="request-modal-close" id="closeModal">×</button>
      <h2>Request Password</h2>
      <form class="request-form" id="requestForm">
        <div class="request-form-group">
          <label for="requestEmail">
            Email <span class="required">*</span>
          </label>
          <input 
            type="email" 
            id="requestEmail" 
            name="email" 
            required
            autocomplete="email"
          >
        </div>
        <div class="request-form-group">
          <label for="requestName">
            Name and Surname <span class="required">*</span>
          </label>
          <input 
            type="text" 
            id="requestName" 
            name="name" 
            required
            autocomplete="name"
          >
        </div>
        <div class="request-form-group">
          <label for="requestCompany">
            Company (optional)
          </label>
          <input 
            type="text" 
            id="requestCompany" 
            name="company"
            autocomplete="organization"
          >
        </div>
        <button type="submit" id="submitRequest">Request Password</button>
        <div class="request-message" id="requestMessage"></div>
      </form>
    </div>
  </div>

  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  
  <script>
    (function() {
      const CORRECT_PASSWORD = 'password123'; // Cambia questa password
      
      const loginForm = document.getElementById('loginForm');
      const passwordInput = document.getElementById('passwordInput');
      const loginError = document.getElementById('loginError');
      const askLink = document.getElementById('askLink');
      const requestModal = document.getElementById('requestModal');
      const closeModal = document.getElementById('closeModal');
      const requestForm = document.getElementById('requestForm');
      const requestMessage = document.getElementById('requestMessage');
      const submitRequest = document.getElementById('submitRequest');
      
      // CONFIGURA QUESTI VALORI DOPO LA REGISTRAZIONE SU EMAILJS
      const EMAILJS_PUBLIC_KEY = 'RVPYqEHmnX4dNDOAt'; // Sostituisci con la tua Public Key
      const EMAILJS_SERVICE_ID = 'service_12aeh1q'; // Sostituisci con il tuo Service ID
      const EMAILJS_TEMPLATE_REQUEST = 'template_8ictyyk'; // Template per mail di richiesta a te
      
      // Inizializza EmailJS
      emailjs.init(EMAILJS_PUBLIC_KEY);
      
      // Genera un token one-time crittografato per l'approvazione
      function generateApprovalToken() {
        const timestamp = Date.now();
        const random = Math.random().toString(36).substring(2, 15);
        const token = btoa(timestamp + '|' + random + '|approval');
        return encodeURIComponent(token);
      }
      
      // Genera un token one-time crittografato per l'accesso
      function generateToken() {
        const timestamp = Date.now();
        const random = Math.random().toString(36).substring(2, 15);
        const token = btoa(timestamp + '|' + random + '|' + CORRECT_PASSWORD);
        return encodeURIComponent(token);
      }
      
      // Gestisce il submit del form di login
      loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const enteredPassword = passwordInput.value.trim();
        
        if (enteredPassword === CORRECT_PASSWORD) {
          // Password corretta: genera token e redirect
          const token = generateToken();
          window.location.href = `index.html?token=${token}`;
        } else {
          // Password errata: mostra errore
          loginError.classList.add('show');
          passwordInput.value = '';
          passwordInput.focus();
        }
      });
      
      // Apri modale richiesta password
      askLink.addEventListener('click', function(e) {
        e.preventDefault();
        requestModal.classList.add('show');
        document.getElementById('requestEmail').focus();
      });
      
      // Chiudi modale
      closeModal.addEventListener('click', function() {
        requestModal.classList.remove('show');
        requestMessage.classList.remove('show', 'success', 'error');
        requestForm.reset();
      });
      
      // Chiudi modale cliccando fuori
      requestModal.addEventListener('click', function(e) {
        if (e.target === requestModal) {
          requestModal.classList.remove('show');
          requestMessage.classList.remove('show', 'success', 'error');
          requestForm.reset();
        }
      });
      
      // Gestisce il submit del form di richiesta
      requestForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('requestEmail').value.trim();
        const name = document.getElementById('requestName').value.trim();
        const company = document.getElementById('requestCompany').value.trim();
        
        // Disabilita il pulsante durante l'invio
        submitRequest.disabled = true;
        submitRequest.textContent = 'Sending...';
        requestMessage.classList.remove('show', 'success', 'error');
        
        try {
          // Genera token per l'approvazione
          const approvalToken = generateApprovalToken();
          
          // Costruisci l'URL di approvazione
          const approveUrl = `${window.location.origin}${window.location.pathname.replace('login.html', 'approve.html')}?token=${approvalToken}&email=${encodeURIComponent(email)}&name=${encodeURIComponent(name)}${company ? '&company=' + encodeURIComponent(company) : ''}`;
          
          // Invia email a te con i dati e link di approvazione
          await emailjs.send(
            EMAILJS_SERVICE_ID,
            EMAILJS_TEMPLATE_REQUEST,
            {
              to_email: 'elenamauri32@gmail.com',
              to_name: 'Elena',
              requester_email: email,
              requester_name: name,
              requester_company: company || 'Not provided',
              approve_url: approveUrl,
              request_date: new Date().toLocaleString('it-IT')
            }
          );
          
          requestMessage.textContent = 'Request sent successfully! I will review it and send you the password soon.';
          requestMessage.classList.add('show', 'success');
          requestForm.reset();
          
          // Chiudi modale dopo 3 secondi
          setTimeout(() => {
            requestModal.classList.remove('show');
            requestMessage.classList.remove('show', 'success');
          }, 3000);
        } catch (error) {
          console.error('Error sending request:', error);
          requestMessage.textContent = 'Error sending request. Please try again or contact me directly at elenamauri32@gmail.com';
          requestMessage.classList.add('show', 'error');
        } finally {
          submitRequest.disabled = false;
          submitRequest.textContent = 'Request Password';
        }
      });
    })();
  </script>
</body>
</html>
